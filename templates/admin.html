<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Viktorina Tarixi</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 20px; }
        h1 { color: #333; text-align: center; }
        table { width: 100%; border-collapse: collapse; background: #fff; margin-top: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); overflow-x: auto; display: block; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: center; white-space: nowrap; }
        th { background-color: #007bff; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
    </style>
</head>
<body>
    <h1>So'rovnomalar va Natijalar Tarixi</h1>
    <table>
        <thead>
            <tr>
                <th>№</th>
                <th>Ism</th>
                <th>Telefon</th>
                <th>Maktab</th>
                <th>MFY</th>
                <th>Natija</th>
                <th>Sana</th>
            </tr>
        </thead>
        <tbody>
            {% for r in results %}
            <tr>
                <td>{{ loop.index }}</td>
                <td>{{ r[0] }}</td>
                <td>{{ r[1] }}</td>
                <td>{{ r[2] }}</td>
                <td>{{ r[3] }}</td>
                <td><b>{{ r[4] }}</b> / {{ r[5] }}</td>
                <td>{{ r[6] }}</td>
            </tr>
            {% else %}
            <tr>
                <td colspan="7">Hali hech qanday natija mavjud emas.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
